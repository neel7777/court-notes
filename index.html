<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#173e31" />
    <meta
      name="description"
      content="Your personal pickleball open-play journal."
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
    <link rel="stylesheet" href="style.css" />
    <title>Court Notes · Pickleball journal</title>
  </head>
  <body>
    <div class="app">
      <header>
        <a class="brand" href="./"
          ><span class="logo">◉</span> court notes<span class="brand-dot"
            >.</span
          ></a
        ><button
          id="settings"
          class="icon-button"
          aria-label="Backup and install information"
        >
          ☰
        </button>
      </header>
      <main id="main"></main>
      <nav aria-label="Main navigation">
        <button data-view="sessions" class="active">
          <span>▦</span>My sessions</button
        ><button data-view="players"><span>♧</span>Players</button
        ><button data-view="insights"><span>↗</span>My progress</button>
      </nav>
    </div>
    <dialog id="modal"></dialog>
    <div id="toast" role="status"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
